[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ojuny-ci"
version = "0.1.0"
description = "Ojuny CI runner"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ojuny-ci = "ojuny_ci.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
